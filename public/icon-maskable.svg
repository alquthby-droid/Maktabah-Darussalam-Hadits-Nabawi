<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#0f3d21"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background without radius for maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered scaled group (scale 0.78 to stay securely within the 80% safe zone circle) -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Decorative Islamic Geometric Ring -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGradMask)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGradMask)" stroke-width="2" opacity="0.6"/>

    <!-- Open Quran / Hadith Book (Kitab) Icon -->
    <g transform="translate(256, 275)">
      <!-- Shadows -->
      <path d="M 0 35 C -45 15, -110 20, -145 35 C -152 37, -160 30, -160 20 L -160 -90 C -160 -98, -152 -103, -145 -105 C -105 -118, -45 -115, 0 -95 Z" fill="#064e3b" opacity="0.6"/>
      <path d="M 0 35 C 45 15, 110 20, 145 35 C 152 37, 160 30, 160 20 L 160 -90 C 160 -98, 152 -103, 145 -105 C 105 -118, 45 -115, 0 -95 Z" fill="#064e3b" opacity="0.6"/>

      <!-- Pages -->
      <path d="M -5 30 C -48 12, -108 17, -142 30 C -149 32, -155 26, -155 18 L -155 -85 C -155 -92, -149 -97, -142 -99 C -104 -112, -48 -108, -5 -90 Z" fill="#f8fafc"/>
      <path d="M 5 30 C 48 12, 108 17, 142 30 C 149 32, 155 26, 155 18 L 155 -85 C 155 -92, 149 -97, 142 -99 C 104 -112, 48 -108, 5 -90 Z" fill="#f1f5f9"/>

      <line x1="0" y1="-95" x2="0" y2="35" stroke="url(#goldGradMask)" stroke-width="4"/>

      <!-- Lines -->
      <line x1="-130" y1="-70" x2="-30" y2="-75" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-130" y1="-45" x2="-40" y2="-50" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-125" y1="-20" x2="-35" y2="-25" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-120" y1="5" x2="-50" y2="0" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

      <line x1="30" y1="-75" x2="130" y2="-70" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="40" y1="-50" x2="130" y2="-45" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="35" y1="-25" x2="125" y2="-20" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="50" y1="0" x2="120" y2="5" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Stand -->
      <path d="M -90 40 L -130 95 L -95 95 L -55 45 Z" fill="url(#goldGradMask)"/>
      <path d="M 90 40 L 130 95 L 95 95 L 55 45 Z" fill="url(#goldGradMask)"/>
      <path d="M -60 45 L 60 45 L 30 75 L -30 75 Z" fill="#ca8a04"/>
    </g>

    <!-- Star -->
    <g transform="translate(256, 115)">
      <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="url(#goldGradMask)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
