<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#0f3d21"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Decorative Islamic Geometric Ring / Arch -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Arch silhouette subtle -->
  <path d="M 120 400 L 120 250 C 120 150, 256 100, 256 100 C 256 100, 392 150, 392 250 L 392 400 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Open Quran / Hadith Book (Kitab) Icon -->
  <g transform="translate(256, 275)" id="book-icon">
    <!-- Left page shadow -->
    <path d="M 0 35 C -45 15, -110 20, -145 35 C -152 37, -160 30, -160 20 L -160 -90 C -160 -98, -152 -103, -145 -105 C -105 -118, -45 -115, 0 -95 Z" fill="#064e3b" opacity="0.6"/>
    <!-- Right page shadow -->
    <path d="M 0 35 C 45 15, 110 20, 145 35 C 152 37, 160 30, 160 20 L 160 -90 C 160 -98, 152 -103, 145 -105 C 105 -118, 45 -115, 0 -95 Z" fill="#064e3b" opacity="0.6"/>

    <!-- Left Page -->
    <path d="M -5 30 C -48 12, -108 17, -142 30 C -149 32, -155 26, -155 18 L -155 -85 C -155 -92, -149 -97, -142 -99 C -104 -112, -48 -108, -5 -90 Z" fill="#f8fafc"/>
    <!-- Right Page -->
    <path d="M 5 30 C 48 12, 108 17, 142 30 C 149 32, 155 26, 155 18 L 155 -85 C 155 -92, 149 -97, 142 -99 C 104 -112, 48 -108, 5 -90 Z" fill="#f1f5f9"/>

    <!-- Gold Edge Trim -->
    <path d="M -5 30 C -48 12, -108 17, -142 30" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M 5 30 C 48 12, 108 17, 142 30" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Spine -->
    <line x1="0" y1="-95" x2="0" y2="35" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Calligraphy / Text lines left page -->
    <line x1="-130" y1="-70" x2="-30" y2="-75" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-130" y1="-45" x2="-40" y2="-50" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-125" y1="-20" x2="-35" y2="-25" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-120" y1="5" x2="-50" y2="0" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Calligraphy / Text lines right page -->
    <line x1="30" y1="-75" x2="130" y2="-70" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="40" y1="-50" x2="130" y2="-45" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="35" y1="-25" x2="125" y2="-20" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="0" x2="120" y2="5" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Golden Rehal (X Stand) -->
    <path d="M -90 40 L -130 95 L -95 95 L -55 45 Z" fill="url(#goldGrad)"/>
    <path d="M 90 40 L 130 95 L 95 95 L 55 45 Z" fill="url(#goldGrad)"/>
    <path d="M -60 45 L 60 45 L 30 75 L -30 75 Z" fill="#ca8a04"/>
  </g>

  <!-- Crescent and 8-point Islamic Star at Top Center -->
  <g transform="translate(256, 115)">
    <!-- 8-point Islamic Star -->
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>
