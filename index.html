    <script>
      // Gracefully handle benign Vite HMR websocket connection messages in container preview
      (function() {
        // 1. Mock WebSocket for Vite HMR to prevent connection failures in sandboxed reverse-proxy environments
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function MockViteWebSocket(url, protocols) {
            var isVite = (protocols === 'vite-hmr' || protocols === 'vite-ping') ||
                         (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf(':24678') !== -1));
            if (isVite) {
              var target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CLOSING = 2;
              target.CONNECTING = 0;
              target.send = function() {};
              target.close = function() {};
              target.binaryType = 'blob';
              target.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        // 2. Intercept console.error and console.warn for any benign Vite logs
        var _origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('vite-hmr') !== -1)) {
            console.debug.apply(console, arguments);
            return;
          }
          _origError.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('vite-hmr') !== -1)) {
            console.debug.apply(console, arguments);
            return;
          }
          _origWarn.apply(console, arguments);
        };

        // 3. Catch unhandled errors or rejections mentioning [vite]
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && event.message.indexOf('[vite]') !== -1) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('[vite]') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
